# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Release gpq-image-ocr

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate py314 with black
        run: |
          black --target-version=py314 ./gpq.py
      - name: Build app & zip
        run: |
          pyinstaller gpq.py
          cp members.json.example dist/gpq
          mkdir "dist/gpq/scores"
          cd dist
          mv gpq gpq-${{ github.sha }}
          Compress-Archive -Path gpq-${{ github.sha }} -DestinationPath ../gpq-${{ github.ref_name }}.zip
          cd ..
      - name: Release
        if: env.ACT == '' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: gpq-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
